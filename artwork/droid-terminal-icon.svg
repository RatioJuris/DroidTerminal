<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193252" />
      <stop offset="55%" stop-color="#0E1E34" />
      <stop offset="100%" stop-color="#060F1C" />
    </linearGradient>

    
    <linearGradient id="outerRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#29D8C5" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#17B9D0" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#17B9D0" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62F2BC" />
      <stop offset="100%" stop-color="#14B8D4" />
    </linearGradient>

    
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2136" />
      <stop offset="100%" stop-color="#091423" />
    </linearGradient>

    
    <filter id="windowShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020810" flood-opacity="0.65" />
    </filter>

    
    <filter id="promptGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <clipPath id="termClip">
      <rect x="80" y="104" width="352" height="304" rx="32" />
    </clipPath>
  </defs>

  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#outerRim)" stroke-width="3" />

  
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  
  <g filter="url(#windowShadow)">
    <rect x="80" y="104" width="352" height="304" rx="32" fill="url(#termBg)" />
  </g>

  
  <g clip-path="url(#termClip)">
    <rect x="80" y="104" width="352" height="56" fill="#132740" />
    <path d="M80 160 H432" stroke="#233E5B" stroke-width="3" />
  </g>

  
  <rect x="80" y="104" width="352" height="304" rx="32" fill="none" stroke="url(#accent)" stroke-width="11" />

  
  <circle cx="118" cy="132" r="8.5" fill="#FF6B6B" />
  <circle cx="146" cy="132" r="8.5" fill="#F4C95D" />
  <circle cx="174" cy="132" r="8.5" fill="#51D6A4" />

  
  <path d="M142 214 L196 262 L142 310" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#promptGlow)" />

  
  <path d="M226 310 H314" stroke="#EAF4FF" stroke-width="20" stroke-linecap="round" />

  
  <rect x="342" y="274" width="16" height="46" rx="6" fill="url(#accent)" filter="url(#promptGlow)" />

  
  <path d="M114 366 H398" stroke="#233E5B" stroke-width="4" stroke-linecap="round" opacity="0.75" />
</svg>