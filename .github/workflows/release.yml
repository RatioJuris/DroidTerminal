name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to rebuild (for example v0.1.0)'
        required: true
        type: string
      rebuild:
        description: 'Publish a clearly identified replacement instead of failing if the release exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate semantic version
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.target.outputs.ref }}
        run: |
          if ! [[ "$TARGET_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semantic version tag: $TARGET_VERSION"
            exit 1
          fi
          echo "VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"

      - name: Check out exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Validate version metadata
        shell: bash
        run: |
          EXPECTED="${VERSION#v}"
          ACTUAL=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::versionName '$ACTUAL' does not match tag '$EXPECTED'"
            exit 1
          fi
          echo "Version metadata verified: $ACTUAL (versionCode 1)"

      - name: Guard against overwriting an existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1 && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "::error::Release $VERSION already exists. Re-run with rebuild=true for a clearly identified replacement."
            exit 1
          fi

      - name: Decide release tag
        shell: bash
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "RELEASE_TAG=${VERSION}-rebuild-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"
          fi
          echo "Publishing as $RELEASE_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package is retired; install required packages explicitly below.
          packages: ''

      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$SIGNING_KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Validate dependency resolution
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath

      - name: Check for committed signing material
        shell: bash
        run: |
          if git ls-files | grep -Ei '(\.jks|\.keystore|signing\.properties)$'; then
            echo "::error::Signing material must never be committed"
            exit 1
          fi

      - name: Run complete unit test suite
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon lint

      - name: Build signed APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk

      - name: Verify AAB signature
        shell: bash
        run: |
          jarsigner -verify -verbose app/build/outputs/bundle/release/*.aab

      - name: Generate checksums
        shell: bash
        run: |
          cd app/build/outputs
          {
            sha256sum apk/release/*.apk
            sha256sum bundle/release/*.aab
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "# Droid Terminal $VERSION"
            echo
            echo "- Source tag: $VERSION"
            echo "- Immutable commit: ${{ github.sha }}"
            echo "- Rebuild tag: $RELEASE_TAG"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artefacts: signed APK and AAB with SHA-256 checksums."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
          retention-days: 30
          if-no-files-found: warn

      - name: Publish signed release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Droid Terminal ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
            RELEASE_NOTES.md
            app/build/reports/lint-results*.html
