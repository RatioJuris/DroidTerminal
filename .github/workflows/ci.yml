name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package is retired; install required packages explicitly below.
          packages: ''

      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Print toolchain versions
        run: ./gradlew --version

      - name: Validate dependency resolution
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon lint

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload review APK
        uses: actions/upload-artifact@v4
        with:
          name: ux-review-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Store debug APK in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          mkdir -p builds/debug
          cp app/build/outputs/apk/debug/*.apk \
            "builds/debug/droidterminal-debug-${{ github.run_number }}-${{ github.sha }}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/debug
          if git diff --cached --quiet; then
            echo "Build output already present; nothing to commit."
            exit 0
          fi
          git commit -m "store build"
          for attempt in 1 2 3; do
            if git push origin HEAD:develop; then
              echo "Published build to builds/debug"
              exit 0
            fi
            echo "Push rejected; refreshing against develop (attempt $attempt)."
            git fetch origin develop
            if ! git rebase origin/develop; then
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Unable to publish build after 3 attempts."
          exit 1
